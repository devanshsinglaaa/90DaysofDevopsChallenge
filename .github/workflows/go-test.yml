name: Set up GO and run Tests

on:
  workflow_dispatch:

jobs:

  code-checkout-setup-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout Code
        uses: actions/checkout@v4

      - name: Set up GO
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Display Go version
        run: go version

      - name: GO test
        run: go test ./...