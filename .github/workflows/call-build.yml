name: Call Build Workflow

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

# un comment above three lines to run the workflow on every push.

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml

    with:
      app_name: "my-web-app"
      environment: "production"

    secrets:
      docker_token: ${{ secrets.DOCKERHUB_TOKEN }}

  print-version:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Printing the Build version
        run: |
          echo "Build Version : ${{ needs.build.outputs.build_version }}"