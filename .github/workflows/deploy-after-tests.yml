name: Deploy After Tests

on:
  workflow_run:
    workflows:
      - Run Tests
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "🚀 Tests passed."
          echo "Deploying application..."

  deployment-failed:
    if: github.event.workflow_run.conclusion != 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Print Warning
        run: |
          echo "❌ Deployment skipped because tests failed."