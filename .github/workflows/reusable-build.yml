name: Re Usable Build Workflow

on:
  workflow_call:
    inputs:
      app_name:
          description: Name of the application
          required: true
          type: string

      environment:
        description: Deployment environment
        required: true
        default: staging
        type: string

    secrets:
      docker_token:
        description: Docker Hub Token
        required: true

    outputs:
      build_version:
        description: Generated Build Version
        value: ${{ jobs.build.outputs.build_version }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.build_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print build information
        run: |
          echo "Building : ${{ inputs.app_name }}"
          echo "Environment : ${{ inputs.environment }}"

      - name: Verify Docker Token Authentication
        run: |
          if [ -n "${{ secrets.docker_token }}" ]; then
            echo "The secret docker token set : true"
          else
            echo "The secret docker token set : false"
          fi

      - name: Generate Build Version
        id: version
        run: |
          VERSION="v1.0-${GITHUB_SHA::7}"
          echo "Build Version: $VERSION"
          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"