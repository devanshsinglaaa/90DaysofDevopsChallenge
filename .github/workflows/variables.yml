name: variables_env_scope

on:
  workflow_dispatch:

env:
  APP_NAME: myapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging

    steps:
      - name: printing all env variables
        env:
          VERSION: 1.0.0
        run: |
          echo "App Name: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Version: $VERSION"

          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered By: ${{ github.actor }}"
